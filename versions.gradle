ext {
    //Dagger
    daggerVersion = '2.45'
    dagger = "com.google.dagger:dagger:$daggerVersion"
    daggerCompiler = "com.google.dagger:dagger-compiler:$daggerVersion"
    //RxJava
    rxJavaVersion = '3.0.0'
    rxJava = "io.reactivex.rxjava3:rxjava:$rxJavaVersion"
    //Room
    roomVersion = '2.4.0'
    room = "androidx.room:room-runtime:$roomVersion"
    roomRxJava = "androidx.room:room-rxjava3:$roomVersion"
    roomCompiler = "androidx.room:room-compiler:$roomVersion"
    //paging
    pagingVersion = "2.1.2"
    paging = "androidx.paging:paging-common:$pagingVersion"
    pagingRuntime = "androidx.paging:paging-runtime:$pagingVersion"
    pagingRxJava = "androidx.paging:paging-rxjava2:$pagingVersion"
    //paging3
    paging3Version = "3.0.1"
    paging3Runtime = "androidx.paging:paging-runtime:$paging3Version"
    paging3RxJava = "androidx.paging:paging-rxjava2:$paging3Version"

}